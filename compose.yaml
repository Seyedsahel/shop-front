services:
  front:
    image: shop-front:latest
    build: .
    ports:
      - "127.0.0.1:${FRONT_PORT:-3001}:3000"
    environment:
      NUXT_BACKEND_URL: ${NUXT_BACKEND_URL:?Set NUXT_BACKEND_URL to the container-accessible backend origin}
      NUXT_PUBLIC_IMAGE_BASE_URL: ${NUXT_PUBLIC_IMAGE_BASE_URL:?Set NUXT_PUBLIC_IMAGE_BASE_URL to the backend catalog image URL}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Set NUXT_PUBLIC_SITE_URL to the public storefront origin}
      NUXT_USE_MOCK_DATA: "false"
    restart: unless-stopped
